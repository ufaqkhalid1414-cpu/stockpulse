<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2200" viewBox="0 0 900 2200">
  <defs>
    <style>
      .t { font: 700 20px Segoe UI, Arial, sans-serif; fill: #2D3B5E; }
      .s { font: 600 12px Segoe UI, Arial, sans-serif; fill: #2D3B5E; }
      .m { font: 600 13px Segoe UI, Arial, sans-serif; fill: #2D3B5E; }
      .yn { font: 700 12px Segoe UI, Arial, sans-serif; fill: #B4552E; }
      .box { fill: #fff; stroke: #2D3B5E; stroke-width: 2; }
      .start { fill: #EDF3E7; stroke: #1E4630; stroke-width: 2.5; }
      .end { fill: #FAF6EE; stroke: #2D3B5E; stroke-width: 2.5; }
      .dia { fill: #FFF8E7; stroke: #D9A947; stroke-width: 2; }
      .api { fill: #F4F7FB; stroke: #2D3B5E; stroke-width: 2; }
      .data { fill: #FAF6EE; stroke: #D9A947; stroke-width: 2; }
      .line { stroke: #2D3B5E; stroke-width: 2; fill: none; }
      .dash { stroke: #2D3B5E; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2D3B5E"/></marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" class="t">StockPulse  Step-by-step Flowchart</text>
  <text x="450" y="54" text-anchor="middle" class="s">Oval = Start/End · Rectangle = Process · Diamond = Decision · Rounded = API / Data</text>

  <!-- START -->
  <ellipse cx="450" cy="100" rx="70" ry="28" class="start"/>
  <text x="450" y="106" text-anchor="middle" class="m">START</text>
  <line x1="450" y1="128" x2="450" y2="160" class="line" marker-end="url(#a)"/>

  <rect x="310" y="160" width="280" height="44" rx="6" class="box"/>
  <text x="450" y="188" text-anchor="middle" class="m">Landing page /</text>
  <line x1="450" y1="204" x2="450" y2="236" class="line" marker-end="url(#a)"/>

  <rect x="280" y="236" width="340" height="50" rx="6" class="box"/>
  <text x="450" y="258" text-anchor="middle" class="m">Login /login  WhatsApp OTP</text>
  <text x="450" y="276" text-anchor="middle" class="s">Sign in from landing</text>
  <line x1="450" y1="286" x2="450" y2="320" class="line" marker-end="url(#a)"/>

  <rect x="280" y="320" width="340" height="44" rx="8" class="api"/>
  <text x="450" y="348" text-anchor="middle" class="m">API: /api/auth/otp  Request code</text>
  <line x1="450" y1="364" x2="450" y2="396" class="line" marker-end="url(#a)"/>

  <path d="M450,396 L545,445 L450,494 L355,445 Z" class="dia"/>
  <text x="450" y="435" text-anchor="middle" class="s">Under rate limit?</text>
  <text x="450" y="453" text-anchor="middle" class="s">max 3 / 10 min</text>

  <text x="320" y="420" class="yn">No</text>
  <line x1="355" y1="445" x2="200" y2="445" class="line"/>
  <line x1="200" y1="445" x2="200" y2="520" class="line" marker-end="url(#a)"/>
  <rect x="100" y="520" width="200" height="44" rx="6" class="box"/>
  <text x="200" y="548" text-anchor="middle" class="s">Show wait / error</text>
  <line x1="200" y1="564" x2="200" y2="590" class="line"/>
  <line x1="200" y1="590" x2="450" y2="590" class="line"/>
  <line x1="450" y1="590" x2="450" y2="364" class="line" marker-end="url(#a)"/>

  <text x="560" y="420" class="yn">Yes</text>
  <line x1="545" y1="445" x2="680" y2="445" class="line"/>
  <line x1="680" y1="445" x2="680" y2="620" class="line" marker-end="url(#a)"/>

  <rect x="540" y="620" width="280" height="50" rx="6" class="box"/>
  <text x="680" y="642" text-anchor="middle" class="m">Send OTP via Twilio</text>
  <text x="680" y="660" text-anchor="middle" class="s">WhatsApp sandbox / optional</text>
  <line x1="680" y1="670" x2="680" y2="710" class="line"/>
  <line x1="680" y1="710" x2="450" y2="710" class="line"/>
  <line x1="450" y1="710" x2="450" y2="740" class="line" marker-end="url(#a)"/>

  <rect x="300" y="740" width="300" height="44" rx="6" class="box"/>
  <text x="450" y="768" text-anchor="middle" class="m">Verify 6-digit code</text>
  <line x1="450" y1="784" x2="450" y2="816" class="line" marker-end="url(#a)"/>

  <path d="M450,816 L530,860 L450,904 L370,860 Z" class="dia"/>
  <text x="450" y="866" text-anchor="middle" class="s">Code valid?</text>

  <text x="335" y="845" class="yn">No</text>
  <line x1="370" y1="860" x2="220" y2="860" class="line"/>
  <line x1="220" y1="860" x2="220" y2="940" class="line" marker-end="url(#a)"/>
  <rect x="120" y="940" width="200" height="40" rx="6" class="box"/>
  <text x="220" y="966" text-anchor="middle" class="s">Error ’ retry OTP</text>
  <line x1="220" y1="980" x2="220" y2="1000" class="line"/>
  <line x1="220" y1="1000" x2="450" y2="1000" class="line"/>
  <line x1="450" y1="1000" x2="450" y2="784" class="line" marker-end="url(#a)"/>

  <text x="545" y="845" class="yn">Yes</text>
  <line x1="530" y1="860" x2="620" y2="860" class="line"/>
  <line x1="620" y1="860" x2="620" y2="1040" class="line"/>
  <line x1="620" y1="1040" x2="450" y2="1040" class="line"/>
  <line x1="450" y1="1040" x2="450" y2="1070" class="line" marker-end="url(#a)"/>

  <rect x="280" y="1070" width="340" height="44" rx="6" class="box"/>
  <text x="450" y="1098" text-anchor="middle" class="m">Session cookie  30 days</text>
  <line x1="450" y1="1114" x2="450" y2="1146" class="line" marker-end="url(#a)"/>

  <path d="M450,1146 L555,1195 L450,1244 L345,1195 Z" class="dia"/>
  <text x="450" y="1185" text-anchor="middle" class="s">New account?</text>
  <text x="450" y="1203" text-anchor="middle" class="s">Need business setup?</text>

  <text x="310" y="1170" class="yn">Yes</text>
  <line x1="345" y1="1195" x2="160" y2="1195" class="line"/>
  <line x1="160" y1="1195" x2="160" y2="1280" class="line" marker-end="url(#a)"/>
  <rect x="40" y="1280" width="240" height="55" rx="8" class="api"/>
  <text x="160" y="1302" text-anchor="middle" class="s">Setup business name</text>
  <text x="160" y="1320" text-anchor="middle" class="s">API: /api/business</text>
  <line x1="160" y1="1335" x2="160" y2="1380" class="line"/>
  <line x1="160" y1="1380" x2="450" y2="1380" class="line"/>
  <line x1="450" y1="1380" x2="450" y2="1410" class="line" marker-end="url(#a)"/>

  <text x="575" y="1170" class="yn">No</text>
  <line x1="555" y1="1195" x2="700" y2="1195" class="line"/>
  <line x1="700" y1="1195" x2="700" y2="1380" class="line"/>
  <line x1="700" y1="1380" x2="450" y2="1380" class="line"/>

  <!-- Role diamond -->
  <path d="M450,1410 L560,1470 L450,1530 L340,1470 Z" class="dia"/>
  <text x="450" y="1460" text-anchor="middle" class="s">Which role?</text>

  <!-- Owner -->
  <text x="575" y="1445" class="yn">Owner</text>
  <line x1="560" y1="1470" x2="720" y2="1470" class="line"/>
  <line x1="720" y1="1470" x2="720" y2="1580" class="line" marker-end="url(#a)"/>
  <rect x="600" y="1580" width="240" height="44" rx="6" class="box"/>
  <text x="720" y="1608" text-anchor="middle" class="m">Owner home /dashboard</text>
  <line x1="720" y1="1624" x2="720" y2="1660" class="line" marker-end="url(#a)"/>

  <rect x="580" y="1660" width="280" height="40" rx="6" class="box"/>
  <text x="720" y="1686" text-anchor="middle" class="s">Dashboard  stock value · low stock</text>
  <line x1="720" y1="1700" x2="720" y2="1725" class="line" marker-end="url(#a)"/>
  <rect x="580" y="1725" width="280" height="36" rx="6" class="box"/>
  <text x="720" y="1749" text-anchor="middle" class="s">Owners &amp; Staff (/staff)</text>
  <line x1="720" y1="1761" x2="720" y2="1786" class="line" marker-end="url(#a)"/>
  <rect x="580" y="1786" width="280" height="36" rx="6" class="box"/>
  <text x="720" y="1810" text-anchor="middle" class="s">Price charts (/prices)</text>
  <line x1="720" y1="1822" x2="720" y2="1847" class="line" marker-end="url(#a)"/>
  <rect x="580" y="1847" width="280" height="36" rx="6" class="box"/>
  <text x="720" y="1871" text-anchor="middle" class="s">Settings</text>
  <line x1="720" y1="1883" x2="720" y2="1915" class="line" marker-end="url(#a)"/>

  <!-- Settings branch -->
  <rect x="560" y="1915" width="320" height="36" rx="8" class="api"/>
  <text x="720" y="1939" text-anchor="middle" class="s">System Status ’ /api/system-status</text>
  <line x1="720" y1="1951" x2="720" y2="1976" class="line" marker-end="url(#a)"/>
  <rect x="560" y="1976" width="320" height="36" rx="6" class="box"/>
  <text x="720" y="2000" text-anchor="middle" class="s">Back up now ’ Blob + /api/stock</text>
  <line x1="720" y1="2012" x2="720" y2="2037" class="line" marker-end="url(#a)"/>
  <rect x="560" y="2037" width="320" height="36" rx="6" class="box"/>
  <text x="720" y="2061" text-anchor="middle" class="s">Backup History ’</text>
  <line x1="720" y1="2073" x2="720" y2="2098" class="line" marker-end="url(#a)"/>
  <rect x="560" y="2098" width="320" height="36" rx="6" class="box"/>
  <text x="720" y="2122" text-anchor="middle" class="s">Shopify connect / sync</text>

  <!-- Staff add -->
  <text x="300" y="1445" class="yn">Staff add</text>
  <line x1="340" y1="1470" x2="200" y2="1470" class="line"/>
  <line x1="200" y1="1470" x2="200" y2="1580" class="line" marker-end="url(#a)"/>
  <rect x="80" y="1580" width="240" height="50" rx="6" class="box"/>
  <text x="200" y="1602" text-anchor="middle" class="m">Staff add</text>
  <text x="200" y="1620" text-anchor="middle" class="s">/add-product ’ /api/stock</text>

  <!-- Staff view via bottom of diamond -->
  <line x1="450" y1="1530" x2="450" y2="1680" class="line" marker-end="url(#a)"/>
  <text x="470" y="1560" class="yn">Staff view</text>
  <rect x="330" y="1680" width="240" height="50" rx="6" class="box"/>
  <text x="450" y="1702" text-anchor="middle" class="m">Staff view</text>
  <text x="450" y="1720" text-anchor="middle" class="s">/items</text>

  <!-- Backend / data strip at bottom left -->
  <rect x="40" y="1780" width="480" height="200" rx="10" class="data"/>
  <text x="280" y="1810" text-anchor="middle" class="m">Backend &amp; Data layer (always)</text>
  <text x="60" y="1840" class="s">" Next.js API: app/api/*  ·  /api/stock  ·  /api/business</text>
  <text x="60" y="1862" class="s">" /api/auth/otp  ·  /api/system-status</text>
  <text x="60" y="1884" class="s">" Cron: /api/cron/daily-backup  ·  /api/cron/monthly-chart</text>
  <text x="60" y="1906" class="s">" DB: SQLite via libSQL (local · optional Turso)</text>
  <text x="60" y="1928" class="s">" Vercel Blob: DB flush + JSON backups (durable sync)</text>
  <text x="60" y="1950" class="s">" Twilio WhatsApp: OTP and optional messages</text>

  <ellipse cx="280" cy="2140" rx="70" ry="26" class="end"/>
  <text x="280" y="2146" text-anchor="middle" class="m">END / RUN</text>
  <line x1="280" y1="1980" x2="280" y2="2114" class="line" marker-end="url(#a)"/>

  <ellipse cx="720" cy="2180" rx="70" ry="22" class="end"/>
  <text x="720" y="2186" text-anchor="middle" class="m">USE APP</text>
  <line x1="720" y1="2134" x2="720" y2="2158" class="line" marker-end="url(#a)"/>
</svg>
